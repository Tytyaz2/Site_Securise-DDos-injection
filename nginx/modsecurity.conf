SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

SecRule ARGS "@rx attack" \
    "id:1234,phase:2,deny,log,msg:'Detected possible attack pattern in request'"

SecRule REQUEST_HEADERS:User-Agent "curl" \
    "id:1235,phase:1,deny,status:403,msg:'Curl detected in User-Agent'"

SecRule IP:REQUESTS "@gt 10" \
    "id:9001,phase:1,drop,msg:'Too many requests from this IP'";



# SQLi Detection Rules
SecRule ARGS "(?i:(union.*select|select.*from|insert into|update .* set|delete from|drop table|alter table))" \
    "id:2001,phase:2,deny,log,msg:'SQLi keyword detected in ARGS'"

SecRule REQUEST_URI "(?i:(union.*select|select.*from|insert into|update .* set|delete from|drop table|alter table))" \
    "id:2002,phase:2,deny,log,msg:'SQLi keyword detected in URI'"

SecRule REQUEST_BODY "(?i:(union.*select|select.*from|insert into|update .* set|delete from|drop table|alter table))" \
    "id:2003,phase:2,deny,log,msg:'SQLi keyword detected in request body'"

SecRule ARGS "(?i:(\bOR\b.+\b=\b|\bAND\b.+\b=\b))" \
    "id:2004,phase:2,deny,log,msg:'Possible SQL tautology detected in ARGS'"

SecRule ARGS "(?i:(--|#|/\*))" \
    "id:2005,phase:2,deny,log,msg:'SQL comment token detected in ARGS'"
