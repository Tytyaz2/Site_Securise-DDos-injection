spring.application.name=site_web_securise

# ---------------------------------------------------------------------------
# Database — credentials must be overridden via environment variables in prod
# SECURITY: never commit real credentials; use env vars or a secrets manager.
#   export SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/db
#   export SPRING_DATASOURCE_USERNAME=appuser
#   export SPRING_DATASOURCE_PASSWORD=<strong-secret>
# ---------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/site_securise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_IN_PRODUCTION}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# reCAPTCHA — load secret from environment, never hard-code
#   export RECAPTCHA_SECRET_KEY=<your-secret>
# ---------------------------------------------------------------------------
recaptcha.secret.key=${RECAPTCHA_SECRET_KEY:CHANGE_ME_IN_PRODUCTION}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# SECURITY: use 'validate' in production so schema changes are explicit
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# SECURITY: disable verbose SQL logging in production (set to WARN or ERROR)
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql=WARN

# Application-level logging
logging.level.com.app=INFO

# Session
server.servlet.session.timeout=1800
# SECURITY: enforce Secure + HttpOnly flags on the session cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
spring.session.jdbc.initialize-schema=always

# SECURITY: suppress Spring Boot error details from responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false