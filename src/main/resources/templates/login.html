<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<h2>Connexion</h2>
<p th:if="${param.error} and ${param.error[0]} == 'captcha'" style="color: red;">
  Veuillez valider le captcha pour continuer.
</p>
<form th:action="@{/login}" method="post">
  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>

  <div class="g-recaptcha" data-sitekey="6LcuUAsrAAAAAJgwBlmdr655sNHgVhzyOkEm2kj_"></div>

  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <button type="submit">Se connecter</button>
</form>

<p th:if="${captchaError}" th:text="${captchaError}" style="color:red;"></p>
</body>
</html>
