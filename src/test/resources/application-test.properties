# ---------------------------------------------------------------------------
# Test profile — H2 in-memory database, no real secrets required
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Spring Session entirely in tests — SessionConfig is excluded via @Profile("!test")
# and we exclude Boot's auto-configuration to avoid JDBC session setup on H2
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# Dummy secrets — no real values committed
recaptcha.secret.key=test-dummy-key
ADMIN_INITIAL_PASSWORD=TestAdminPassword1234!

# Disable Secure cookie flag — no HTTPS in test environment
server.servlet.session.cookie.secure=false

# Suppress noisy logs during tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.app=WARN
